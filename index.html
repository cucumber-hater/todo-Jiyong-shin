<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>할 일 목록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>할 일 목록</h1>

    <!-- 할 일 입력 영역 -->
    <div class="input-row">
      <input id="todo-input" type="text" placeholder="할 일을 입력하세요" autocomplete="off">
      <input id="author-input" type="text" placeholder="작성자 이름 (선택)" autocomplete="off">
      <input id="due-input" type="date" title="마감일 (선택)" aria-label="마감일 (선택)">
      <button id="add-button" type="button">추가</button>
    </div>

    <!-- 오류가 생기면 여기에 보여 줍니다 -->
    <p id="error-message" role="alert" hidden></p>

    <!-- 보기 고르기(필터) + 남은 할 일 개수 -->
    <div class="toolbar">
      <div class="filters" role="group" aria-label="보기 고르기">
        <button type="button" class="filter-button" data-filter="all" aria-pressed="true">전체</button>
        <button type="button" class="filter-button" data-filter="active" aria-pressed="false">진행 중</button>
        <button type="button" class="filter-button" data-filter="done" aria-pressed="false">완료</button>
      </div>
      <span id="remaining-count"></span>
    </div>

    <!-- 할 일이 여기에 추가됩니다 -->
    <ul id="todo-list"></ul>

    <p id="empty-message" hidden>아직 할 일이 없어요.</p>
  </main>

  <!-- 순서가 중요해요: Supabase 도구 → 연결 정보 → 앱 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
